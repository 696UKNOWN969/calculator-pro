
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">

<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./icon-192.png">
<title>Calculator Pro</title>

<style>
:root {
    --bg: #101114;
    --panel: #1c1e24;
    --screen: #14161b;
    --button: #292c34;
    --button-hover: #393d48;
    --text: #ffffff;
    --muted: #999eaa;
    --accent: #f39b43;
    --green: #36a879;
    --border: #30333c;
}

body.light {
    --bg: #e9ebf0;
    --panel: #ffffff;
    --screen: #f2f3f7;
    --button: #e5e7ed;
    --button-hover: #d4d7e0;
    --text: #20222a;
    --muted: #737783;
    --accent: #e9892d;
    --green: #269568;
    --border: #d9dce4;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    transition: background .3s, color .3s;
}

.app {
    width: 100%;
    max-width: 850px;
    display: grid;
    grid-template-columns: minmax(300px, 1fr) 240px;
    gap: 18px;
}

.calculator, .history-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 15px 45px #0002;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.header h2 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 1px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.small-btn {
    background: var(--button);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    transition: .2s;
}

.small-btn:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
}

.screen {
    background: var(--screen);
    border: 1px solid var(--border);
    border-radius: 15px;
    min-height: 110px;
    padding: 18px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
}

#expression {
    color: var(--muted);
    font-size: 15px;
    min-height: 20px;
    text-align: right;
    overflow-wrap: anywhere;
}

#display {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: clamp(28px, 6vw, 38px);
    text-align: right;
    font-weight: bold;
    margin-top: 12px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    font-family: inherit;
}

.key {
    height: 57px;
    background: var(--button);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 19px;
    cursor: pointer;
    transition: background .15s, transform .12s, box-shadow .12s;
    user-select: none;
}

.key:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
}

.key:active, .key.pressed {
    transform: scale(.93);
}

.operator {
    color: var(--accent);
    font-weight: bold;
}

.equal {
    background: var(--green);
    color: white;
    border: none;
}

.equal:hover {
    background: #298c65;
}

.clear {
    color: #ff7777;
}

.scientific {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin-bottom: 10px;
}

.scientific.visible {
    display: grid;
    animation: slideDown .25s ease;
}

.scientific .key {
    height: 43px;
    font-size: 14px;
    color: var(--accent);
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.history-panel h3 {
    margin: 3px 0 17px;
    font-size: 16px;
}

.history-list {
    max-height: 380px;
    overflow-y: auto;
}

.history-item {
    padding: 12px 9px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    border-radius: 8px;
    transition: background .2s;
}

.history-item:hover {
    background: var(--button);
}

.history-expression {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
    overflow-wrap: anywhere;
}

.history-result {
    font-size: 17px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.empty {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

.history-footer {
    margin-top: 15px;
}

.history-footer button {
    width: 100%;
}

.footer {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    margin-top: 17px;
}

@media(max-width: 650px) {
    body {
        padding: 12px;
        align-items: flex-start;
    }

    .app {
        grid-template-columns: 1fr;
    }

    .history-panel {
        min-height: 130px;
    }

    .history-list {
        max-height: 200px;
    }
}
</style>
</head>

<body>

<div class="app">

    <main class="calculator">

        <div class="header">
            <h2>CALCULATOR PRO</h2>

            <div class="header-actions">
                <button class="small-btn" data-action="sound"
                        title="Toggle sound">🔊</button>
                <button class="small-btn" data-action="theme"
                        title="Toggle theme">☀️</button>
            </div>
        </div>

        <div class="screen">
            <div id="expression"></div>
            <input id="display" value="0" readonly>
        </div>

        <div class="scientific" id="scientific">
            <button class="key" data-value="sin(">sin</button>
            <button class="key" data-value="cos(">cos</button>
            <button class="key" data-value="tan(">tan</button>
            <button class="key" data-value="sqrt(">√</button>

            <button class="key" data-value="log(">log</button>
            <button class="key" data-value="ln(">ln</button>
            <button class="key" data-value="^2">x²</button>
            <button class="key" data-value="^">xʸ</button>

            <button class="key" data-value="(">(</button>
            <button class="key" data-value=")">)</button>
            <button class="key" data-value="PI">π</button>
            <button class="key" data-value="E">e</button>
        </div>

        <div class="buttons">

            <button class="key clear" data-action="clear">AC</button>
            <button class="key" data-action="delete">DEL</button>
            <button class="key operator" data-value="%">%</button>
            <button class="key operator" data-value="/">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key operator" data-value="*">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key operator" data-value="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key operator" data-value="+">+</button>

            <button class="key" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
            <button class="key equal" data-action="equals">=</button>
            <button class="key operator" data-action="scientific">ƒx</button>

        </div>

        <div class="footer">
            ENTER = Calculate · BACKSPACE = Delete · ESC = Clear
        </div>

    </main>

    <aside class="history-panel">

        <h3>Calculation History</h3>

        <div class="history-list" id="historyList">
            <p class="empty">Your calculations will appear here.</p>
        </div>

        <div class="history-footer">
            <button class="small-btn" data-action="clear-history">
                Clear history
            </button>
        </div>

    </aside>

</div>

<script>
const display = document.getElementById("display");
const expressionDisplay = document.getElementById("expression");
const scientific = document.getElementById("scientific");
const historyList = document.getElementById("historyList");

let expression = "";
let history = [];

let soundEnabled = true;
let justCalculated = false;

// Load saved settings and history
try {
    history = JSON.parse(
        localStorage.getItem("calculatorHistory") || "[]"
    );

    if (!Array.isArray(history)) history = [];

    if (localStorage.getItem("calculatorTheme") === "light") {
        document.body.classList.add("light");
    }

    if (localStorage.getItem("calculatorSound") === "off") {
        soundEnabled = false;
    }
} catch {
    history = [];
}

function updateDisplay() {
    display.value = expression || "0";
}

function playSound() {
    if (!soundEnabled) return;

    try {
        const audio = new AudioContext();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.frequency.value = 550;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(0.04, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001, audio.currentTime + 0.07
        );

        oscillator.start();
        oscillator.stop(audio.currentTime + 0.07);

        oscillator.onended = () => audio.close();
    } catch (error) {
        console.log("Audio unavailable");
    }
}

function addValue(value) {
    playSound();

    const operators = ["+", "-", "*", "/", "%", "^"];

    if (justCalculated) {
        if (!operators.includes(value)) {
            expression = "";
            expressionDisplay.textContent = "";
        }
        justCalculated = false;
    }

    if (!expression && operators.includes(value) && value !== "-") {
        return;
    }

    if (expression === "Error") expression = "";

    expression += value;
    updateDisplay();
}

function deleteLast() {
    playSound();
    if (justCalculated) {
        expression = "";
        justCalculated = false;
    } else {
        expression = expression.slice(0, -1);
    }
    updateDisplay();
}

function clearCalculator() {
    playSound();
    expression = "";
    expressionDisplay.textContent = "";
    justCalculated = false;
    updateDisplay();
}

// Scientific calculator uses degrees for trigonometry
function calculate() {
    if (!expression) return;

    try {
        const original = expression;

        // Only permit calculator characters and known functions
        if (!/^[0-9+\-*/().%\sA-Za-z^]+$/.test(original)) {
            throw new Error("Invalid expression");
        }

        const allowed = [
            "sin", "cos", "tan", "sqrt",
            "log", "ln", "PI", "E"
        ];

        const words = original.match(/[A-Za-z]+/g) || [];

        if (words.some(word => !allowed.includes(word))) {
            throw new Error("Invalid function");
        }

        const normalized = original
            .replace(/\bPI\b/g, "Math.PI")
            .replace(/\bE\b/g, "Math.E")
            .replace(/\^/g, "**")
            .replace(/\bsin\(/g, "sin(")
            .replace(/\bcos\(/g, "cos(")
            .replace(/\btan\(/g, "tan(")
            .replace(/\bsqrt\(/g, "sqrt(")
            .replace(/\blog\(/g, "log(")
            .replace(/\bln\(/g, "ln(");

        const functions = {
            sin: x => Math.sin(x * Math.PI / 180),
            cos: x => Math.cos(x * Math.PI / 180),
            tan: x => Math.tan(x * Math.PI / 180),
            sqrt: x => Math.sqrt(x),
            log: x => Math.log10(x),
            ln: x => Math.log(x)
        };

        const result = new Function(
            "sin", "cos", "tan", "sqrt", "log", "ln",
            `"use strict"; return (${normalized});`
        )(
            functions.sin,
            functions.cos,
            functions.tan,
            functions.sqrt,
            functions.log,
            functions.ln
        );

        if (typeof result !== "number" || !Number.isFinite(result)) {
            throw new Error("Math error");
        }

        const formatted = Number(result.toPrecision(12)).toString();

        expressionDisplay.textContent = original + " =";
        expression = formatted;
        justCalculated = true;

        saveHistory(original, formatted);
        updateDisplay();
        playSound();

    } catch (error) {
        expression = "Error";
        justCalculated = true;
        updateDisplay();
    }
}

function saveHistory(original, result) {
    history.unshift({
        expression: original,
        result: result
    });

    history = history.slice(0, 30);

    try {
        localStorage.setItem(
            "calculatorHistory",
            JSON.stringify(history)
        );
    } catch (error) {
        console.log("Could not save history");
    }

    renderHistory();
}

function renderHistory() {
    historyList.replaceChildren();

    if (history.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Your calculations will appear here.";
        historyList.appendChild(empty);
        return;
    }

    history.forEach(item => {
        const entry = document.createElement("div");
        entry.className = "history-item";

        const expr = document.createElement("div");
        expr.className = "history-expression";
        expr.textContent = item.expression;

        const result = document.createElement("div");
        result.className = "history-result";
        result.textContent = "= " + item.result;

        entry.append(expr, result);

        entry.addEventListener("click", () => {
            expression = item.result;
            expressionDisplay.textContent = item.expression + " =";
            justCalculated = true;
            updateDisplay();
        });

        historyList.appendChild(entry);
    });
}

function toggleTheme() {
    document.body.classList.toggle("light");

    localStorage.setItem(
        "calculatorTheme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}

function toggleSound() {
    soundEnabled = !soundEnabled;

    localStorage.setItem(
        "calculatorSound",
        soundEnabled ? "on" : "off"
    );

    document.querySelector('[data-action="sound"]').textContent =
        soundEnabled ? "🔊" : "🔇";

    playSound();
}

function toggleScientific() {
    scientific.classList.toggle("visible");
}

function clearHistory() {
    history = [];
    localStorage.removeItem("calculatorHistory");
    renderHistory();
}

// Mouse and touchscreen buttons
document.querySelector(".calculator").addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;

    if (button.dataset.value !== undefined) {
        addValue(button.dataset.value);
    }

    switch (button.dataset.action) {
        case "clear":
            clearCalculator();
            break;
        case "delete":
            deleteLast();
            break;
        case "equals":
            calculate();
            break;
        case "theme":
            toggleTheme();
            break;
        case "sound":
            toggleSound();
            break;
        case "scientific":
            toggleScientific();
            break;
    }
});

document.querySelector('[data-action="clear-history"]')
    .addEventListener("click", clearHistory);

// Physical keyboard support
document.addEventListener("keydown", event => {
    const key = event.key;

    if (/^[0-9]$/.test(key)) {
        addValue(key);
    } else if (["+", "-", "*", "/", "%", "^", "(", ")"].includes(key)) {
        addValue(key);
    } else if (key === ".") {
        addValue(".");
    } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
    } else if (key === "Backspace") {
        deleteLast();
    } else if (key === "Escape") {
        clearCalculator();
    } else {
        return;
    }

    const button = [...document.querySelectorAll(".key")]
        .find(btn => btn.dataset.value === key ||
            (key === "Enter" && btn.dataset.action === "equals"));

    if (button) {
        button.classList.add("pressed");
        setTimeout(() => button.classList.remove("pressed"), 120);
    }
});

// Initial setup
renderHistory();
updateDisplay();

document.querySelector('[data-action="sound"]').textContent =
    soundEnabled ? "🔊" : "🔇";

document.querySelector('[data-action="theme"]').textContent =
    document.body.classList.contains("light") ? "🌙" : "☀️";

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(error => {
                console.error("Service Worker error:", error);
            });
    });
}
</script>


</body>
</html>
